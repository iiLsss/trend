[project]
name = "ai-trend-agent"
version = "0.1.0"
description = "AI Trend Analyzer Agent: scraping, denoising, unbundling, and re-bundling"
requires-python = ">=3.11"
dependencies = [
    "instructor>=1.7.0",
    "openai>=1.60.0",
    "anthropic>=0.40.0",
    "feedparser>=6.0.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "supabase>=2.10.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
